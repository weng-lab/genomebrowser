packages:
  - apps/*
  - packages/*
  - packages/create/template

catalog:
  "react": "19.3.0"
  "react-dom": "19.3.0"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@emotion/react": "11.14.0"
  "@emotion/styled": "11.14.1"
  "@mui/icons-material": "7.3.11"
  "@mui/material": "7.3.11"
  "@mui/x-license": "8.29.3"
  "@types/node": "^26.6.2"
  "@typescript/native": "npm:typescript@^7.0.2"
  "@vitejs/plugin-react": "^6.1.1"
  "jsdom": "^26.1.0"
  "typescript": "npm:@typescript/typescript6@^6.0.2"
  "vite": "^8.3.0"
  "vite-plugin-dts": "^4.5.4"
  "vitest": "5.0.1"
  "zod": "^4.4.3"
  "next": "16.3.3"
  "@weng-lab/ui-components": "3.3.0"
  "oxfmt": "0.61.0"
  "oxlint": "1.76.0"

catalogs:
  native:
    "typescript": "7.0.2"

allowBuilds:
  # Optional telemetry initialization fails with ENOENT in MUI X 8.29.0.
  "@mui/x-telemetry": false
  esbuild: true
  sharp: true
