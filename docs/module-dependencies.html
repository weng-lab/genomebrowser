<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Genomebrowser module dependencies</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0b0e11;
        --surface: #11161b;
        --border: #35404a;
        --text: #e5ebf0;
        --muted: #9ba8b4;
        --accent: #9cc7e8;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--background);
      }

      body {
        max-width: 1600px;
        margin: 0 auto;
        padding: 48px 32px 80px;
        background: var(--background);
        color: var(--text);
        font-family: "IBM Plex Mono", "Liberation Mono", "DejaVu Sans Mono", monospace;
        font-size: 14px;
        line-height: 1.6;
      }

      header {
        margin-bottom: 40px;
        border-bottom: 1px solid var(--border);
      }

      h1,
      h2 {
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 17px;
        color: var(--accent);
      }

      p {
        max-width: 90ch;
        margin: 0 0 24px;
        color: var(--muted);
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        margin: 24px 0;
      }

      nav a {
        color: var(--text);
        text-decoration: none;
      }

      nav a:hover,
      nav a:focus-visible {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      section {
        margin: 0 0 48px;
        scroll-margin-top: 24px;
      }

      .diagram {
        min-height: 180px;
        overflow: auto;
        padding: 24px;
        border: 1px solid var(--border);
        background: var(--surface);
      }

      .diagram svg {
        display: block;
        min-width: 900px;
        height: auto;
        margin: 0 auto;
      }

      .status {
        color: var(--muted);
      }

      .error {
        white-space: pre-wrap;
        color: #ffb4ab;
      }

      @media (max-width: 720px) {
        body {
          padding: 28px 16px 56px;
        }

        .diagram {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Genomebrowser module dependencies</h1>
      <p>
        Static source dependencies by package. Arrows point from consumers to dependencies;
        dashed arrows identify type-only, export, dynamic-import, or URL relationships.
      </p>
      <nav id="navigation" aria-label="Diagram sections"></nav>
    </header>

    <main id="diagrams">
      <p class="status">Loading diagrams…</p>
    </main>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      const navigation = document.querySelector("#navigation");
      const diagrams = document.querySelector("#diagrams");

      function toId(heading) {
        return heading
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
      }

      try {
        const response = await fetch("./module-dependencies.md");
        if (!response.ok) throw new Error(`Could not load diagram source: HTTP ${response.status}`);

        const markdown = await response.text();
        const matches = [...markdown.matchAll(/^## (.+?)\n[\s\S]*?```mermaid\n([\s\S]*?)```/gm)];
        if (matches.length === 0) throw new Error("No Mermaid diagrams found in module-dependencies.md");

        diagrams.replaceChildren();

        for (const [, heading, source] of matches) {
          const id = toId(heading);
          const link = document.createElement("a");
          link.href = `#${id}`;
          link.textContent = heading;
          navigation.append(link);

          const section = document.createElement("section");
          section.id = id;

          const title = document.createElement("h2");
          title.textContent = heading;

          const diagram = document.createElement("div");
          diagram.className = "diagram mermaid";
          diagram.textContent = source.trim();

          section.append(title, diagram);
          diagrams.append(section);
        }

        mermaid.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          theme: "base",
          fontFamily: '"IBM Plex Mono", "Liberation Mono", "DejaVu Sans Mono", monospace',
          themeVariables: {
            background: "#0b0e11",
            primaryColor: "#16212a",
            primaryTextColor: "#e5ebf0",
            primaryBorderColor: "#7892a6",
            secondaryColor: "#11161b",
            secondaryTextColor: "#e5ebf0",
            secondaryBorderColor: "#607789",
            tertiaryColor: "#11161b",
            tertiaryTextColor: "#e5ebf0",
            tertiaryBorderColor: "#526573",
            lineColor: "#a7b5c0",
            textColor: "#e5ebf0",
            edgeLabelBackground: "#11161b",
            clusterBkg: "#0f1419",
            clusterBorder: "#526573",
            fontSize: "13px",
          },
          flowchart: {
            curve: "linear",
            htmlLabels: true,
            nodeSpacing: 34,
            rankSpacing: 50,
            useMaxWidth: false,
          },
        });

        await mermaid.run({ querySelector: ".mermaid" });
      } catch (error) {
        diagrams.innerHTML = `<p class="error">${error instanceof Error ? error.message : String(error)}</p>`;
      }
    </script>
  </body>
</html>
