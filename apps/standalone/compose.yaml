name: genomebrowser
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: genomebrowser
      POSTGRES_USER: genomebrowser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sessions_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genomebrowser -d genomebrowser"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  sessions_pgdata:
