# Local PostgreSQL for saved sessions and Redis for agent commands. Matches .env.example.
name: genomebrowser
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: genomebrowser
      POSTGRES_PASSWORD: genomebrowser
      POSTGRES_DB: genomebrowser
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "genomebrowser"]
      interval: 2s
      retries: 15
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

volumes:
  postgres:
