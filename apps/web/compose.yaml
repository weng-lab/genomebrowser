# Local PostgreSQL for saved sessions. Matches DATABASE_URL in .env.example.
name: genomebrowser
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: genomebrowser
      POSTGRES_PASSWORD: genomebrowser
      POSTGRES_DB: genomebrowser
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "genomebrowser"]
      interval: 2s
      retries: 15

volumes:
  postgres:
