name: Contribution review

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: contribution-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review contribution clarity
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'issues' ||
        (!github.event.pull_request.draft &&
         github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository guidance
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install OpenCode
        run: npm install --global @opencode/cli@2.0.16

      - name: Review contribution
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTRIBUTION_KIND: ${{ github.event_name == 'issues' && 'issue' || 'PR' }}
          CONTRIBUTION_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          opencode run --standalone --auto \
            --agent contribution-review \
            --model vercel/anthropic/claude-opus-5.5 \
            "Review $CONTRIBUTION_KIND #$CONTRIBUTION_NUMBER in $GH_REPO for enough information to act. Publish an advisory clarification only if needed, following your instructions."
