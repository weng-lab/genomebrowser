name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: 1
      GB_TEST_DATABASE_URL: postgres://genomebrowser:genomebrowser@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: genomebrowser
          POSTGRES_PASSWORD: genomebrowser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genomebrowser"
          --health-interval 2s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust tools
        run: cargo test --manifest-path tools/gtf-to-big-gene-pred-plus/Cargo.toml --locked

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        # Turbo runs packages concurrently, and each Vitest process starts workers.
        # Keep both levels within the runner's CPU budget to avoid timer starvation.
        run: pnpm test --concurrency=2 -- --maxWorkers=1
