name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read
  actions: read
  issues: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review quality and scope
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install OpenCode
        run: npm install --global @opencode/cli@2.0.16

      - name: Download model catalog
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 60 \
            https://models.opencode.ai/api.json \
            -o "$RUNNER_TEMP/opencode-models.json"

          jq --exit-status '.vercel.models["openai/gpt-6.1-sol"]' \
            "$RUNNER_TEMP/opencode-models.json" > /dev/null

      - name: Review PR
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENCODE_MODELS_PATH: ${{ runner.temp }}/opencode-models.json
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          opencode run --standalone --auto \
            --agent review \
            --model vercel/openai/gpt-6.1-sol \
            "Review PR #$PR_NUMBER in $GH_REPO and publish your findings according to your instructions."
